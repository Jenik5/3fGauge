type: custom:three-f-gauge-card
name: Aktivní výkon
icon:
  template: >-
    {% set power = states("sensor.active_power") | float(0) %}
    {{ "mdi:transmission-tower-export" if power > 0 else "mdi:transmission-tower-import" }}
icon_color:
  template: >-
    {% set power = states("sensor.active_power") | float(0) %}
    {{ "#42a5f5" if power > 0 else "#ef5350" }}
main:
  entity: sensor.active_power
  min: -17000
  max: 4800
  scale: logarithmic
  color_ranges:
    - from: -17000
      color: "#ef5350"
    - from: 0
      color: "#42a5f5"
phases:
  entities:
    - sensor.active_power_l1
    - sensor.active_power_l2
    - sensor.active_power_l3
  names:
    - L1
    - L2
    - L3
  min: -6000
  max: 1800
  scale: logarithmic
  color_ranges:
    - from: -6000
      color: "#ef5350"
    - from: 0
      color: "#42a5f5"
    - from: 1200
      color: "#ffa726"
description:
  template: >-
    {% set power = states("sensor.active_power") | float(0) %}
    {{ "Dodávka" if power > 0 else "Odběr" }}
