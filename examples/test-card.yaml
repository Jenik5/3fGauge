type: custom:three-f-gauge-card
main:
  entity: sensor.active_power
  name: Aktivní výkon
  min: -12000
  max: 12000
  color_ranges:
    - to: -0.01
      color: "#ef5350"
    - from: 0
      color: "#42a5f5"
phases:
  entities:
    - sensor.active_power_l1
    - sensor.active_power_l2
    - sensor.active_power_l3
  names:
    - L1
    - L2
    - L3
  min: -5000
  max: 5000
  color_ranges:
    - to: -0.01
      color: "#ef5350"
    - from: 0
      to: 3500
      color: "#42a5f5"
    - from: 3500.01
      color: "#ffa726"
description:
  template: >-
    {% set power = states("sensor.active_power") | float(0) %}
    {{ "Dodávka" if power > 0 else "Odběr" }}
